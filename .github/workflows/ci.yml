name: ci

on:
  pull_request:
  push:
    branches: [main]
  # deps-lock が GITHUB_TOKEN で入れた constraints.txt のコミットでは CI が動かないので、手でも回せるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: .github/scripts/run.sh bash -c "ruff check . && ruff format --check ."
      - run: .github/scripts/run.sh pytest -q
      - name: checklists are up to date
        run: .github/scripts/run.sh harness checklists --check
      - name: review results are well-formed
        run: .github/scripts/run.sh harness lint

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        shell: bash
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: bash .github/scripts/run.sh pytest -q
      - run: bash .github/scripts/run.sh harness checklists --check

  # [convert]（doc-to-markdown）が本体と一緒に入るか（devtools-common の版の衝突を検出する）と、harness convert が動くか
  convert:
    name: convert（pip install .[convert] と harness convert）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip install .[convert]（editable でない、利用者と同じ入れ方）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C ".[convert,dev]"
          pip show doc-to-markdown devtools-common | grep -E "^(Name|Version|Requires)"
      - name: 固定の確認（入った doc-to-markdown の devtools-common が本体と同じ SHA か）
        env:
          OFFICE_REVIEW_REQUIRE_CONVERT: "1"  # doc-to-markdown が入っていなければ skip でなく失敗にする
        run: .github/scripts/run.sh pytest -q -rs tests/test_pins.py
      - name: サンプルを harness convert して読み戻す
        run: .github/scripts/run.sh python .github/scripts/convert_smoke.py "$RUNNER_TEMP/convert"

  security:
    name: security (bandit・pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存とツールを入れる（ツールの版は固定）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[convert]"
          pip install "bandit==1.8.6" "pip-audit==2.9.0"
      - name: SAST（bandit. 中以上）
        run: .github/scripts/run.sh bandit -q -r src -ll
      - name: 依存の脆弱性（pip-audit）
        run: .github/scripts/run.sh pip-audit --skip-editable --progress-spinner off
