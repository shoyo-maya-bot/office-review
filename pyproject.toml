[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-review"
version = "0.1.0"
description = "設計資料のレビューを、チェックリスト・マルチロール・指摘の蓄積で育てるレビューハーネス（項目間検証 fieldcheck を同梱）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@bfb7f17c5016966058072f4aba3713ab56d146ba",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Office の原本を変換するときだけ必要（harness convert）
convert = ["doc-to-markdown @ git+https://github.com/shoyo-maya-bot/doc-to-markdown.git@main"]

[project.scripts]
harness = "review_harness.cli:entrypoint"
fieldcheck = "field_validation.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/review_harness/{results,dashboard,cli}.py" = ["E501"]
"tests/test_harness.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
