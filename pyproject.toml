[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-review"
version = "0.2.0"
description = "設計資料のレビューを、チェックリスト・マルチロール・指摘の蓄積で育てるレビューハーネス（項目間検証 fieldcheck を同梱）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@04f3915ab696d9312f1526dd11d5178dcd2601eb",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Office の原本を変換するときだけ必要（harness convert）. 依存は SHA で固定（devtools-common の方針）
# doc-to-markdown のこの版が固定している devtools-common は、上の dependencies と同じ版でなければならない
# （違うと pip install ".[convert]" が ResolutionImpossible で失敗する。CI の convert ジョブで、実際に入った依存を
#  tests/test_pins.py が確かめる）
convert = ["doc-to-markdown @ git+https://github.com/shoyo-maya-bot/doc-to-markdown.git@a10ad8737ccb6bac6271ef67cef4d9c9ff0edfce"]

[project.scripts]
harness = "review_harness.cli:entrypoint"
fieldcheck = "field_validation.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/review_harness/{results,dashboard,cli}.py" = ["E501"]
"tests/test_harness.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI（.github/workflows/ci.yml）で `coverage run -m pytest` → `coverage report`. 下限を下回ると失敗する
# （いまは 93% 前後. 少しの増減で落ちないよう 88% を下限にする. 上げるのはよいが、下げるときは PR に理由を書く）
[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
fail_under = 88
show_missing = false
skip_empty = true
